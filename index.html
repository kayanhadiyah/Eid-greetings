<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بطاقات تهنئة العيد - هدية</title>

  <style>
    /* ضع ملف الخط في نفس المجلد: TheYearofHandicrafts-Regular.otf */
    @font-face{
      font-family:"YearHandicrafts";
      src:url("TheYearofHandicrafts-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }

    *{ box-sizing:border-box; font-family:"YearHandicrafts", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }

    body{
      margin:0; padding:20px;
      background:#f3f5f7;
      direction:rtl;
    }

    .container{
      max-width:980px; margin:0 auto;
      background:#fff; padding:24px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
    }

    h1{
      margin:0 0 18px 0;
      text-align:center;
      font-size:26px;
      color:#0a6a63;
      letter-spacing:.2px;
    }

    .grid{
      display:grid;
      grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr);
      gap:24px;
      align-items:flex-start;
    }
    @media (max-width:820px){
      .grid{ grid-template-columns:1fr; }
    }

    label{ display:block; margin-bottom:6px; font-size:14px; color:#444; }
    input[type="text"]{
      width:100%;
      padding:10px 12px;
      font-size:18px;
      border-radius:10px;
      border:1px solid #d6dde3;
      outline:none;
      background:#f9fafb;
    }
    input[type="text"]:focus{
      border-color:#00a89a;
      box-shadow:0 0 0 2px rgba(0,168,154,.15);
      background:#fff;
    }

    .row{ margin-bottom:16px; }
    .hint{ font-size:12px; color:#666; margin-top:6px; }
    .counter{ font-size:12px; color:#666; margin-top:6px; display:flex; justify-content:space-between; gap:10px; }
    .counter strong{ color:#0a6a63; font-weight:600; }

    .buttons{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px;
    }
    button{
      border:none; border-radius:999px;
      padding:10px 20px;
      font-size:16px;
      cursor:pointer;
    }
    #previewBtn{ background:#00a89a; color:#fff; }
    #downloadBtn{ background:#0a6a63; color:#fff; }
    #resetBtn{ background:#f3f5f7; color:#333; }

    .download-note{ font-size:11px; color:#666; margin-top:8px; }

    .canvas-wrap{ text-align:center; }
    canvas{
      max-width:100%;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.12);
      background:#e5e7eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>مولِّد بطاقات تهنئة العيد - جمعية هدية</h1>

    <div class="grid">
      <div>
        <div class="row">
          <label for="titleInput">اللقب  (حتى 10 أحرف):</label>
          <input id="titleInput" type="text" maxlength="10" placeholder="مثال: محبكم" />
          <div class="counter">
           
            <span>المتبقي: <strong id="remain">10</strong></span>
          </div>
        </div>

        <div class="row">
          <label for="nameInput">الاسم :</label>
          <input id="nameInput" type="text" placeholder="مثال: محمد الغامدي" />
        </div>

        <div class="buttons">
          <button id="previewBtn">عرض المعاينة</button>
          <button id="downloadBtn">تحميل البطاقة</button>
          <button id="resetBtn">إعادة ضبط</button>
        </div>

        <div class="download-note">
          في حال لم يعمل زر التحميل اضغط مطولًا على الصورة واختر "حفظ الصورة".
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="cardCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    /**
     * ضع صورة القالب في نفس المجلد بهذا الاسم:
     * ramadan-template.jpg
     *
     * (يمكنك إعادة تسمية الصورة المرفقة لديك إلى هذا الاسم)
     */
    const TEMPLATE_SRC = "ramadan-template.jpg";

    // مواضع النص (مضبوطة بناءً على مقاس القالب 1152x2048)
    // لقب داخل الخانة الصفراء (مركز الخانة تقريبًا)
    const titlePos = { xFrac: 0.5, yFrac: 0.80 };
    // الاسم تحت الخانة الصفراء بسطر مستقل
    const namePos  = { xFrac: 0.5, yFrac: 0.845 };

    // ألوان النص
    const TITLE_COLOR = "#ceb26b";     // داخل الخانة الصفراء
    const NAME_COLOR  = "#ffffff";     // ذهبي قريب من النص السفلي

    // أحجام الخط (نسبية من ارتفاع الصورة)
    const TITLE_FONT_FACTOR = 0.05;   // حجم اللقب
    const NAME_FONT_FACTOR  = 0.05;   // حجم الاسم

    const canvas = document.getElementById("cardCanvas");
    const ctx = canvas.getContext("2d");

    const titleInput = document.getElementById("titleInput");
    const nameInput  = document.getElementById("nameInput");
    const remainEl   = document.getElementById("remain");

    const previewBtn  = document.getElementById("previewBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const resetBtn    = document.getElementById("resetBtn");

    let img = new Image();
    let imageLoaded = false;

    function updateRemain(){
      const max = parseInt(titleInput.getAttribute("maxlength") || "10", 10);
      remainEl.textContent = Math.max(0, max - (titleInput.value || "").length);
    }

    function fitTextSize(text, targetWidth, basePx){
      ctx.font = `${basePx}px "YearHandicrafts", system-ui, sans-serif`;
      const w = ctx.measureText(text).width;
      if (w <= targetWidth) return basePx;
      const scale = targetWidth / w;
      return Math.floor(basePx * scale);
    }

    function draw(){
      if(!imageLoaded) return;

      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);

      // نص اللقب
      const titleTextRaw = (titleInput.value || "").trim();
      const titleText = titleTextRaw ? titleTextRaw : "";
      if(titleText){
        const base = Math.floor(TITLE_FONT_FACTOR * h);
        const maxWidth = w * 0.42; // عرض تقريبي للخانة الصفراء
        const size = fitTextSize(titleText, maxWidth, base);

        ctx.font = `${size}px "YearHandicrafts", system-ui, sans-serif`;
        ctx.fillStyle = TITLE_COLOR;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.direction = "rtl";

        ctx.fillText(titleText, titlePos.xFrac*w, titlePos.yFrac*h);
      }

      // نص الاسم
      const nameTextRaw = (nameInput.value || "").trim();
      const nameText = nameTextRaw ? nameTextRaw : "";
      if(nameText){
        const base = Math.floor(NAME_FONT_FACTOR * h);
        const maxWidth = w * 0.70;
        const size = fitTextSize(nameText, maxWidth, base);

        ctx.font = `${size}px "YearHandicrafts", system-ui, sans-serif`;
        ctx.fillStyle = NAME_COLOR;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.direction = "rtl";

        ctx.fillText(nameText, namePos.xFrac*w, namePos.yFrac*h);
      }
    }

    async function safeDownload(filename){
      // أفضل من toDataURL في بعض المتصفحات
      if (canvas.toBlob){
        canvas.toBlob((blob)=>{
          if(!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }, "image/png");
      } else {
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    }

    function sanitizeFileName(name){
      const cleaned = (name || "").replace(/[\\\/:*?"<>|]/g, "-").trim();
      return cleaned || "تهنئة-رمضان";
    }

    function loadTemplate(){
      imageLoaded = false;
      img = new Image();
      img.onload = () => {
        imageLoaded = true;
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        // انتظار بسيط لتحميل الخط قبل الرسم (يساعد على ظهور الخط الصحيح)
        setTimeout(draw, 60);
      };
      img.src = TEMPLATE_SRC;
    }

    // أحداث
    titleInput.addEventListener("input", () => { updateRemain(); draw(); });
    nameInput.addEventListener("input",  () => { draw(); });

    previewBtn.addEventListener("click", () => draw());

    downloadBtn.addEventListener("click", async () => {
      draw();
      const t = sanitizeFileName(titleInput.value);
      const n = sanitizeFileName(nameInput.value);
      await safeDownload(`رمضان-${t}-${n}.png`);
    });

    resetBtn.addEventListener("click", () => {
      titleInput.value = "";
      nameInput.value = "";
      updateRemain();
      draw();
    });

    // تشغيل
    updateRemain();
    loadTemplate();
  </script>
</body>
</html>
